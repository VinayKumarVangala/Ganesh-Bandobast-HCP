name: Build & Release Android APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

env:
  # Use Flutter 3.19+ which includes Dart 3.19+ (satisfies ^3.13.1 requirement)
  # Matches local Flutter 3.47.3 with Dart 3.13.3
  FLUTTER_VERSION: '3.19.0'
  JAVA_VERSION: '17'
  PROJECT_DIR: 'mobile'

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Verify Flutter & Dart
        run: |
          flutter --version
          dart --version
          echo "FLUTTER_VERSION=${FLUTTER_VERSION}" >> $GITHUB_ENV

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs
        continue-on-error: true

      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --coverage --reporter=github

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ${{ env.PROJECT_DIR }}/coverage/lcov.info
          fail_ci_if_error: false

  build-apk:
    name: Build APK (${{ matrix.build_type }})
    needs: analyze-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    strategy:
      matrix:
        build_type: [release, debug]
        include:
          - build_type: release
            artifact_name: ganesh-bandobust-release
            upload_name: ganesh-bandobust-release-apk
          - build_type: debug
            artifact_name: ganesh-bandobust-debug
            upload_name: ganesh-bandobust-debug-apk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Get dependencies
        run: flutter pub get

      - name: Extract version from pubspec
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_name=$(echo $VERSION | cut -d'+' -f1)" >> $GITHUB_OUTPUT
          echo "version_code=$(echo $VERSION | cut -d'+' -f2)" >> $GITHUB_OUTPUT

      - name: Configure release signing (if keystore provided)
        if: matrix.build_type == 'release' && env.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          cat << EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.keystore
          EOF
        shell: bash

      - name: Build APK
        run: |
          flutter build apk --${{ matrix.build_type }} \
            --build-name=${{ steps.version.outputs.version_name }} \
            --build-number=${{ steps.version.outputs.version_code }}

      - name: Verify APK
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-${{ matrix.build_type }}.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found at $APK_PATH"
            exit 1
          fi
          SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "APK size: $SIZE"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        id: apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30
          compression-level: 6

      - name: Upload to Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/') && matrix.build_type == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.apk_path }}
          name: Release ${{ steps.version.outputs.version_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Ganesh Bandobust ${{ steps.version.outputs.version_name }}
            
            **Build Type:** Release APK
            **Build Number:** ${{ steps.version.outputs.version_code }}
            **Date:** ${{ github.event.head_commit.timestamp }}
            **Commit:** ${{ github.sha }}
            
            ### Installation
            1. Download `app-release.apk` below
            2. Enable "Install unknown apps" in Android settings
            3. Install the APK
            
            ### Features
            - Inter-Police-Station Resource Sharing for Nimarjan Stage
            - Resource Directory with Map View
            - Request Workflow with Smart Matching
            - Live Dispatch Tracking
            - Command Dashboard for Senior Officers
            
            ### Changelog
            ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-aab:
    name: Build AAB (Release)
    needs: analyze-and-test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}

      - name: Get dependencies
        run: flutter pub get

      - name: Extract version from pubspec
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_name=$(echo $VERSION | cut -d'+' -f1)" >> $GITHUB_OUTPUT
          echo "version_code=$(echo $VERSION | cut -d'+' -f2)" >> $GITHUB_OUTPUT

      - name: Configure release signing (if keystore provided)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          cat << EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.keystore
          EOF
        shell: bash

      - name: Build App Bundle
        run: |
          flutter build appbundle --release \
            --build-name=${{ steps.version.outputs.version_name }} \
            --build-number=${{ steps.version.outputs.version_code }}

      - name: Verify AAB
        run: |
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "AAB not found at $AAB_PATH"
            exit 1
          fi
          SIZE=$(du -h "$AAB_PATH" | cut -f1)
          echo "AAB size: $SIZE"
          echo "aab_path=$AAB_PATH" >> $GITHUB_OUTPUT
        id: aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ganesh-bandobust-aab
          path: ${{ steps.aab.outputs.aab_path }}
          retention-days: 30

      - name: Upload AAB to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.aab.outputs.aab_path }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Ganesh Bandobust ${{ steps.version.outputs.version_name }} (App Bundle)
            
            **Build Type:** Release AAB (for Play Store)
            **Build Number:** ${{ steps.version.outputs.version_code }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-summary:
    name: Release Summary
    needs: [build-apk, build-aab]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Create Release Summary
        run: |
          echo "## 🎉 Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Type | Download |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| app-release.apk | Release APK | [Download](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| app-release.aab | Release AAB | [Download](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| app-debug.apk | Debug APK | [Download](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release URL:** https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Notify (Optional)
    needs: [build-apk, build-aab]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Send notification on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "❌ Build failed for Ganesh Bandobust",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*❌ Build Failed*\n*Repo:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Commit:* ${{ github.sha }}\n*Workflow:* ${{ github.workflow }}\n*Run:* https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Send notification on success (tag pushes only)
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ Release published for Ganesh Bandobust",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*✅ Release Published*\n*Repo:* ${{ github.repository }}\n*Tag:* ${{ github.ref_name }}\n*Release:* https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true