name: Generate Keystore (Run Once)

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Key alias'
        required: true
        default: 'ganesh-bandobust-key'
      validity:
        description: 'Validity in years'
        required: true
        default: '25'
      store_password:
        description: 'Keystore password'
        required: true
      key_password:
        description: 'Key password (can be same as store)'
        required: true
      dname:
        description: 'Distinguished Name (CN=, OU=, O=, L=, S=, C=)'
        required: true
        default: 'CN=Ganesh Bandobust, OU=Telangana Police, O=Ganesh Festival, L=Hyderabad, S=Telangana, C=IN'

jobs:
  generate:
    name: Generate Keystore
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        id: keystore
        run: |
          ALIAS="${{ github.event.inputs.alias }}"
          VALIDITY="${{ github.event.inputs.validity }}"
          STORE_PASS="${{ github.event.inputs.store_password }}"
          KEY_PASS="${{ github.event.inputs.key_password }}"
          DNAME="${{ github.event.inputs.dname }}"
          
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity $((VALIDITY * 365)) \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "$DNAME"
          
          # Encode to base64 for GitHub Secrets
          BASE64=$(base64 -w 0 release.keystore)
          echo "keystore_base64=$BASE64" >> $GITHUB_OUTPUT

      - name: Output Secrets to Add
        run: |
          echo "=========================================="
          echo "ADD THESE SECRETS TO GITHUB REPOSITORY:"
          echo "=========================================="
          echo ""
          echo "1. Go to: https://github.com/${{ github.repository }}/settings/secrets/actions"
          echo "2. Click 'New repository secret' for each:"
          echo ""
          echo "Name: KEYSTORE_BASE64"
          echo "Value: ${{ steps.keystore.outputs.keystore_base64 }}"
          echo ""
          echo "Name: KEYSTORE_PASSWORD"
          echo "Value: ${{ github.event.inputs.store_password }}"
          echo ""
          echo "Name: KEY_PASSWORD"
          echo "Value: ${{ github.event.inputs.key_password }}"
          echo ""
          echo "Name: KEY_ALIAS"
          echo "Value: ${{ github.event.inputs.alias }}"
          echo ""
          echo "=========================================="
          echo "SAVE THE release.keystore FILE SECURELY!"
          echo "=========================================="

      - name: Upload Keystore (for immediate download)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release.keystore
          retention-days: 1