name: Fast Debug APK

on:
  workflow_dispatch:
  push:
    branches: [v2]
    paths:
      - 'mobile/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
          
      - name: Get dependencies
        run: flutter pub get
        
      - name: Build debug APK (no tests, no analyze)
        run: flutter build apk --debug --no-tree-shake-icons
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ganesh-bandobust-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
Even Faster: Pre-cached Dependencies
Add this to your existing workflow to cache dependencies properly:
- name: Setup Flutter
  uses: subosito/flutter-action@v2
  with:
    flutter-version: '3.24.0'
    channel: stable
    cache: true
    cache-key: flutter-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock') }}